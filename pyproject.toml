[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "venue-rule-diff"
version = "0.1.0"
description = "Article-level change detection for market rulebooks, with source provenance and validation against venue-published change logs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "venue-rule-diff contributors" }]
keywords = ["rulebook", "regulation", "pdf", "diff", "provenance", "bme"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Markup",
]
dependencies = [
    "pymupdf>=1.28,<2",
]

[project.optional-dependencies]
dev = ["pytest>=9"]

[project.scripts]
venue-rule-diff = "venue_rule_diff.cli:main"

[tool.setuptools]
packages = ["venue_rule_diff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
